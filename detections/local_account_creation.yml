title: Local Account Creation Using Net Command
id: 8a0c3957-5933-4d75-91d7-111e424f8a02
status: experimental
description: Detects creation of a local Windows account using net.exe or net1.exe.
author: Siddarth Balagopal
date: 2026-10-04
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_user:
        CommandLine|contains:
            - ' user '
            - ' user'
    selection_add:
        CommandLine|contains:
            - ' /add'
            - '/add '
    condition: selection_image and selection_user and selection_add
falsepositives:
    - Legitimate local account administration
    - Provisioning scripts
level: medium
